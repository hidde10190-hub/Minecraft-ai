plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'Masa Maven'
        url = 'https://masa.dy.fi/maven'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

dependencies {
    // Minecraft & Fabric Environment
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mappings are not required for Minecraft 26.x as the jar is already unobfuscated.
    // Removing loom.officialMojangMappings() to fix "Cannot use Mojang mappings in a non-obfuscated environment" error.

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // High-speed Embedded WebSocket & HTTP Server for AI IPC
    implementation "io.javalin:javalin:6.1.3"
    include "io.javalin:javalin:6.1.3"
    implementation "com.google.code.gson:gson:2.10.1"
    include "com.google.code.gson:gson:2.10.1"

    // Performance Optimization Stack
    implementation("maven.modrinth:AANobbMI:g6ju16VJ") // Sodium 0.9.3-beta.1 for 26.3
    implementation("maven.modrinth:gvQqBUqZ:xS0Q8LSi") // Lithium 0.26.2 for 26.3

    // Simple Voice Chat API
    implementation("maven.modrinth:9eGKb6K1:OLnMVWXy") // Simple Voice Chat 2.6.24 for 26.3
    
    // Litematica, MaLiLib & Syncmatica Integration
    implementation("maven.modrinth:GcWjdA9I:JX9bESec") // MaLiLib 0.30.2 for 26.3
    implementation("maven.modrinth:bEpr0Arc:ZqV316KY") // Litematica 0.29.1 for 26.3
    implementation("maven.modrinth:bfneejKo:uT7TJ2Wp") // Syncmatica 0.3.20 for 26.3
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            name("Minecraft Client")
            source(sourceSets.main)
            String botUser = System.getProperty("minecraft.ai.botname", System.getenv("MINECRAFT_BOT_USERNAME") ?: System.getenv("BOT_NAME") ?: "Gemini")
            programArgs "--username", botUser
            vmArg "-Dfabric.gui.disable=true"
            // Performance: runClient previously used Java's DEFAULT heap (often <256MB),
            // causing constant GC thrashing and in-game lag. Give the game a real heap
            // and a low-pause collector.
            vmArg "-Xms2G"
            vmArg "-Xmx4G"
            vmArg "-XX:+UseG1GC"
            vmArg "-XX:MaxGCPauseMillis=200"
            vmArg "-XX:+PerfDisableSharedMem"
        }
    }
}


processResources {

    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
