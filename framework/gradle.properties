# Build daemon: 2-3G is plenty for Loom remapping. (Was -Xmx8G -Xms4G which made startup
# slow and ate RAM inside the container, starving the actual game process.)
org.gradle.jvmargs=-Xmx3G -Xms512m -XX:+UseG1GC -XX:+EnableDynamicAgentLoading
# Startup speed: enable parallel execution + caching so repeat builds skip rework.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Configure-on-demand: only configures projects actually needed by the task.
org.gradle.configureondemand=true
org.gradle.warning.mode=none

minecraft_version=26.2

loader_version=0.19.5

mod_version=1.0.0
maven_group=com.minecraft.ai
archives_base_name=minecraft-ai-bridge

fabric_version=0.160.0+26.2

# Set to true if targeting Minecraft versions with published official Mojang mappings (e.g. 1.21.x)
# Set to false for 26.2 direct unobfuscated jar mappings (@jar)
use_mojang_mappings=false

malilib_version=0.19.0
litematica_version=0.19.0
syncmatica_version=26.2-0.3.11
