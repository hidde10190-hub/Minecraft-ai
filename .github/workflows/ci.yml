name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            framework/.gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('framework/build.gradle', 'framework/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build Fabric mod (Minecraft 26.3)
        run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain
      - name: API-dump voor gefaalde compilatie (diagnose)
        if: failure()
        run: |
          set +e
          JAR=$(find . "$HOME/.gradle" -name 'minecraft-merged*.jar' ! -name '*sources*' 2>/dev/null | head -1)
          for c in net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.Entity net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.world.entity.player.Inventory; do
            echo "== $c (swing|drop)"; javap -cp "$JAR" -public "$c" | grep -i -E 'swing|drop' ; done
          for c in net.minecraft.world.item.component.SwingAnimation net.minecraft.world.item.SwingAnimationType; do
            echo "== $c"; javap -cp "$JAR" -public "$c" | head -25 ; done
          echo "== DataComponents SWING"; javap -cp "$JAR" -public net.minecraft.core.component.DataComponents | grep -i swing
          echo "== ServerboundPlayerActionPacket.Action"; javap -cp "$JAR" -public 'net.minecraft.network.protocol.game.ServerboundPlayerActionPacket$Action' | grep -i -E 'drop'
