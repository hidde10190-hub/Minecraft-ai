name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            framework/.gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('framework/build.gradle', 'framework/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build Fabric mod (Minecraft 26.3)
        run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain
      - name: API-dump voor gefaalde compilatie (diagnose)
        if: failure()
        run: |
          JAR=$(find . "$HOME/.gradle" -name 'minecraft-merged*.jar' ! -name '*sources*' 2>/dev/null | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR" | grep -E 'SwingAnimation|/Prediction|DropPrediction' | awk '{print $4}' | head
          for c in net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.player.Player; do
            echo "== $c"; javap -cp "$JAR" -public "$c" | grep -E ' (drop|swing|dropSelectedItem)\(' ; done
          for f in $(unzip -l "$JAR" | grep -E 'SwingAnimation|/Prediction' | awk '{print $4}' | sed 's/\.class$//; s#/#.#g' | head -4); do
            echo "== $f"; javap -cp "$JAR" -public "$f" | head -20 ; done
