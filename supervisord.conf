[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1280x720x24
autorestart=true

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
autorestart=true
startsecs=3

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
startsecs=3

[program:bot]
command=node dist/bot/index.js
environment=DISPLAY=":1"
autorestart=true
