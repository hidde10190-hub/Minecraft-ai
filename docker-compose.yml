# 3D Voxel Stage & Multi-Agent Swarm — full stack with noVNC remote desktop
# Usage:  docker compose up -d
#   then open http://localhost:6080/vnc.html?autoconnect=true&resize=scale
#   The app server proxies the stream at /vnc so the Controller tab can embed it.
version: "3.8"

services:
  # Headless Minecraft (Mineflayer) bot inside a virtual X display.
  # x11vnc exposes DISPLAY=:1 on :5900, websockify+noVNC serves it on :6080.
  minecraft-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: voxel-swarm-bot
    environment:
      DISPLAY: ":1"
      MINECRAFT_HOST: "minecraft-server"
      MINECRAFT_PORT: "25565"
      BOT_USERNAME: "SwarmBot"
    ports:
      - "6080:6080"   # noVNC web client (http://localhost:6080/vnc.html)
      - "5900:5900"   # raw VNC (optional, for external VNC viewers)
    depends_on:
      - minecraft-server
    restart: unless-stopped

  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: voxel-swarm-mc
    environment:
      EULA: "TRUE"
      VERSION: "1.20.4"
      MODE: "creative"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
    ports:
      - "25565:25565"
    volumes:
      - mc-data:/data
    restart: unless-stopped

volumes:
  mc-data:
