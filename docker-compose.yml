# ==============================================================================
# Autonomous Standalone Fabric Client - Docker Compose Configuration
# ==============================================================================
# Usage:
#   docker compose up -d
#   docker compose logs -f
# ==============================================================================
services:
  minecraft-standalone-client:
    image: eclipse-temurin:25-jdk-noble
    container_name: minecraft-fabric-standalone
    restart: unless-stopped
    working_dir: /app/framework
    env_file:
      - config.env
    volumes:
      # Narrowed bind mount (was `.:/app`): mounting the whole project including
      # node_modules/dist made Gradle file-watching thrash across thousands of
      # irrelevant files on Docker Desktop, slowing builds and stealing I/O from
      # the running game. Only the framework sources are needed here.
      - ./framework:/app/framework
      # Persist Gradle downloads/caches in a named volume so repeat startups skip
      # re-downloading Minecraft + Loom artifacts (major startup speedup).
      - gradle_cache:/root/.gradle
    ports:
      - "8080:8080"
      - "8079:8080"
    environment:
      - MINECRAFT_SERVER=${MINECRAFT_SERVER:-host.docker.internal:25565}
      - BOT_NAME=${BOT_NAME:-${MINECRAFT_BOT_USERNAME:-Gemini}}
      - MINECRAFT_BOT_USERNAME=${MINECRAFT_BOT_USERNAME:-${BOT_NAME:-Gemini}}
      - AI_IPC_PORT=8080
      # JAVA_TOOL_OPTIONS applies to EVERY JVM in the container (Gradle daemon AND the
      # game client), so it must stay modest: 4G max. The game's own heap is tuned
      # separately in framework/build.gradle (loom runs). Larger values here previously
      # made the Gradle daemon hoard RAM, starving the client and causing in-game lag.
      - JAVA_TOOL_OPTIONS=-Xmx4G -Xms512M -Dfabric.gui.disable=true -XX:+UseG1GC -XX:+PerfDisableSharedMem
    # Resources: sized for a smooth client. NOTE: on Docker Desktop (Windows/Mac) these
    # limits only help if the WSL2/VM total allocation in Docker Settings is raised too
    # (recommended: 16GB RAM / 8 CPUs for the Docker VM).
    deploy:
      resources:
        limits:
          cpus: '6.0'      # Headroom left for host + dashboard
          memory: 8G
        reservations:
          cpus: '3.0'      # Guarantee cores so the client isn't throttled under load
          memory: 5G       # Guarantee so Java never gets squeezed by other containers
    
    # Enable hardware acceleration if a GPU is present (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    shm_size: '4gb'
    # Performance tuning:
    #  - mem_swappiness=0: stop swapping the Java heap out (major cause of GC pauses/lag)
    #  - ulimit memlock: lets the JVM pin its heap so it is never paged to disk
    mem_swappiness: 0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri libgl1 libxi6 libxrender1 libxtst6 libxcursor1 libxrandr2 libxext6 libx11-6 pciutils > /dev/null 2>&1 || true &&
               rm -f /tmp/.X*-lock /tmp/.X11-unix/X* 2>/dev/null || true &&
               Xvfb :99 -screen 0 1024x768x16 &
               export DISPLAY=:99 &&
               export MINECRAFT_SERVER_HOST=\"$$MINECRAFT_SERVER\" &&
               export MINECRAFT_BOT_USERNAME=\"$$BOT_NAME\" &&
               echo '=====================================================' &&
               echo ' [Standalone Container] Launching Fabric Client (Java 25)' &&
               echo ' Server   : '\"$$MINECRAFT_SERVER\" &&
               echo ' Username : '\"$$BOT_NAME\" &&
               echo '=====================================================' &&
               chmod +x ./gradlew && 
               (./gradlew runClient -Dfabric.gui.disable=true -Dminecraft.ai.server=\"$$MINECRAFT_SERVER\" -Dminecraft.ai.botname=\"$$BOT_NAME\" -DMINECRAFT_BOT_USERNAME=\"$$BOT_NAME\" --args=\"--username $$BOT_NAME\" --no-daemon || 
                (echo 'Build failed. Attempting clean build...' && rm -rf .gradle/loom-cache build && ./gradlew clean runClient -Dfabric.gui.disable=true -Dminecraft.ai.server=\"$$MINECRAFT_SERVER\" -Dminecraft.ai.botname=\"$$BOT_NAME\" --args=\"--username $$BOT_NAME\" --no-daemon))"

  web-dashboard:
    image: node:22-slim
    container_name: minecraft-ai-dashboard
    restart: unless-stopped
    working_dir: /app
    env_file:
      - config.env
    ports:
      - "3000:3000"
    environment:
      - MINECRAFT_SERVER_HOST=host.docker.internal
      - MINECRAFT_SERVER_PORT=25565
      - BRIDGE_HOST=minecraft-standalone-client
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Startup speed + resource fairness for the dashboard container:
    #  - node_modules lives in an NAMED volume instead of a host bind mount. On Docker
    #    Desktop (Windows/Mac) bind-mounted node_modules is ~10-50x slower, which made
    #    npm install / vite build crawl and starved CPU while the game was running.
    #  - cpus/mem_limit guarantee the dashboard can't be squeezed to nothing by the
    #    Minecraft client, and vice-versa.
    cpus: '2.0'
    mem_limit: 3g
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    command: >
      bash -c "echo '=====================================================' &&
               echo ' [Web Dashboard] Initializing environment...' &&
               echo '=====================================================' &&
               apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1 || true &&
               if [ ! -d node_modules ] || [ package.json -nt node_modules/.install-stamp ]; then
                 echo 'Installing dependencies (first run only)...' &&
                 (npm install --prefer-offline --no-audit --no-fund || (echo 'Retrying npm install...' && sleep 5 && npm install --prefer-offline --no-audit --no-fund)) &&
                 touch node_modules/.install-stamp
               else
                 echo 'Dependencies cached in volume - skipping npm install.'
               fi && 
               echo '=====================================================' &&
               echo ' [Web Dashboard] Building Application...' &&
               echo '=====================================================' &&
               (npm run build || (echo 'Build failed, trying clean build...' && rm -rf dist && npm run build)) &&
               echo '=====================================================' &&
               echo ' [Web Dashboard] Starting Server on port 3000...' &&
               echo '=====================================================' &&
               npm start"

volumes:
  ollama_data:
  # Gradle dependency + Loom caches (survives container recreation -> fast restarts)
  gradle_cache:
  # Dashboard node_modules kept off the host filesystem for fast npm/vite I/O
  dashboard_node_modules:

networks:
  default:
    name: minecraft-ai-network
